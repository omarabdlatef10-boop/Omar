<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omar Abdul Latef – Web Developer</title>
<meta name="description" content="Web developer building fast, clean websites for businesses worldwide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Cairo:wght@400;600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0A1230;--bg2:#03050A;--surface:#0C1426;--ink:#EAF0FF;--muted:#93A3C4;--line:#1B2850;--accent:#3B82F6;--aink:#fff;--glow:rgba(59,130,246,.32);
--display:'Bricolage Grotesque','Cairo','Segoe UI',sans-serif;--body:'DM Sans','Cairo','Segoe UI',sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="gold"]{--bg1:#2A1F05;--bg2:#060501;--surface:#1A1405;--ink:#FFF6DC;--muted:#C9B887;--line:#4A3A10;--accent:#E0A800;--aink:#1A1200;--glow:rgba(224,168,0,.3)}
:root[data-theme="red"]{--bg1:#2E0A0F;--bg2:#080203;--surface:#1B0B0E;--ink:#FFEDEE;--muted:#C9A0A4;--line:#4F1A22;--accent:#D62839;--aink:#FFFFFF;--glow:rgba(214,40,57,.35)}
:root[dir="rtl"]{--display:'Cairo','Segoe UI',sans-serif;--body:'Cairo','Segoe UI',sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));background:var(--bg2)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:400 1.06rem/1.7 var(--body);background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 900px,var(--bg2));-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg1)}
a{color:inherit}h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 1em;max-width:62ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
section{padding:84px 0}
h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;margin-bottom:10px}
.lead{color:var(--muted)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg1) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:20px;height:66px}
.logo{font:800 1.15rem var(--display);text-decoration:none;margin-inline-end:auto}
nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
nav ul a{text-decoration:none;color:var(--muted);font-weight:500;transition:color .2s}
nav ul a:hover{color:var(--ink)}
.ctl{display:flex;align-items:center;gap:10px}
.lang{font:700 .9rem var(--body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:border-color .2s}
.lang:hover{border-color:var(--accent)}
.dots{display:flex;gap:6px}
.dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.dots button[data-t="black"]{background:linear-gradient(135deg,#3B82F6,#03050A)}
.dots button[data-t="gold"]{background:linear-gradient(135deg,#E0A800,#2A1F05)}
.dots button[data-t="red"]{background:linear-gradient(135deg,#D62839,#2E0A0F)}
.dots button[aria-pressed="true"]{border-color:var(--ink)}
.btn{display:inline-block;background:var(--accent);color:var(--aink);padding:13px 24px;border-radius:10px;font:700 1rem var(--body);text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px var(--glow)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);transition:border-color .2s,transform .2s}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none}
.hero{position:relative;padding:72px 0 88px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:drift 16s ease-in-out infinite alternate;pointer-events:none}
.hero::before{top:-120px;inset-inline-start:-100px}
.hero::after{bottom:-160px;inset-inline-end:-80px;animation-duration:20s}
@keyframes drift{to{transform:translate(50px,36px) scale(1.12)}}
.hero .grid{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.2rem);font-weight:800}
.hero .lead{font-size:1.15rem;margin:20px 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-bottom:18px}
.status i{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 #22C55E;animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 50px -24px var(--glow)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .d{width:10px;height:10px;border-radius:50%;background:var(--line)}
.sw{margin-inline-start:auto;display:flex;gap:4px}
.sw button{font:600 .78rem var(--body);padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--accent);color:var(--aink);border-color:var(--accent)}
.stage{padding:18px;display:flex;justify-content:center;min-height:230px;background:rgba(0,0,0,.25)}
.mini{width:100%;transition:width .4s ease;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.mini[data-w="tablet"]{width:68%}.mini[data-w="phone"]{width:40%}
.mini .n{height:9px;width:40%;background:var(--ink);border-radius:3px;margin-bottom:14px;opacity:.8}
.mini .h{height:44px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:6px;margin-bottom:12px}
.mini .c{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini[data-w="tablet"] .c{grid-template-columns:repeat(2,1fr)}.mini[data-w="phone"] .c{grid-template-columns:1fr}
.c div{height:44px;background:var(--line);border-radius:6px}
.demo small{display:block;padding:10px 14px;color:var(--muted);border-top:1px solid var(--line);font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 18px 40px -22px var(--glow)}
.card h3{font-size:1.2rem;margin:16px 0 6px}
.card p{color:var(--muted);font-size:.98rem;margin-bottom:12px}
.shot{height:150px;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.shot i{display:block;border-radius:5px}
.shot .b{height:8px;width:35%}.shot .h{height:44px}
.shot .r{display:flex;gap:6px;flex:1}.shot .r i{flex:1}
.s1{background:#EAF2FF}.s1 .b{background:#1E3A8A}.s1 .h{background:linear-gradient(90deg,#2563EB,#60A5FA)}.s1 .r i{background:#fff;border:1px solid #CFE0FF}
.s2{background:#0B1B16}.s2 .b{background:#34D399}.s2 .h{background:#12332A}.s2 .r{align-items:flex-end}.s2 .r i{background:#34D399}
.s3{background:#FFF4E8}.s3 .b{background:#9A3412}.s3 .h{background:linear-gradient(90deg,#EA580C,#FB923C)}.s3 .r i{background:#fff;border:1px solid #FFD9B8}
img.shot{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;padding:0;border:1px solid var(--line);border-radius:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.sm{padding:8px 16px;font-size:.92rem;margin-top:14px}
.tags span{font-size:.8rem;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;padding:30px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--surface),transparent)}
.stats div{text-align:center}
.stats b{display:block;font:800 clamp(2rem,5vw,3.2rem) var(--display);color:var(--accent);line-height:1.1}
.stats span{color:var(--muted);font-size:.95rem}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.svc .card{padding:24px;border-top:3px solid var(--accent)}
.svc h3{margin:0 0 8px}.svc p{margin:0}
.about{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:center}
.gal{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px;border:1px solid var(--line);aspect-ratio:4/5;background:var(--surface)}
.track::-webkit-scrollbar{display:none}
.track>*{flex:0 0 100%;scroll-snap-align:center;width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;font:800 4rem var(--display);color:var(--aink);background:linear-gradient(135deg,var(--accent),var(--bg1))}
.ph:nth-child(2){filter:hue-rotate(25deg)}.ph:nth-child(3){filter:hue-rotate(-25deg)}
.gb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer;backdrop-filter:blur(6px);transition:border-color .2s}
.gb:hover{border-color:var(--accent)}
.gb.p{inset-inline-start:10px}.gb.n{inset-inline-end:10px}
[dir="rtl"] .gb{transform:translateY(-50%) scaleX(-1)}
.gd{display:flex;justify-content:center;gap:7px;margin-top:14px}
.gd i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:background .2s,width .2s}
.gd i.on{background:var(--accent);width:22px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px}
.facts span{padding:6px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.skills{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.skills li{background:var(--surface);border:1px solid var(--line);padding:8px 16px;border-radius:10px;font-weight:500;transition:border-color .2s,transform .2s}
.skills li:hover{border-color:var(--accent);transform:translateY(-2px)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:44px;margin-bottom:48px}
form{display:grid;gap:12px}
input,textarea{font:inherit;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);width:100%;transition:border-color .2s}
input:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.ways{display:grid;gap:12px;align-content:start}
.ways a{display:flex;flex-direction:column;padding:14px 18px;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .2s,transform .2s;overflow-wrap:anywhere}
.ways a:hover{border-color:var(--accent);transform:translateX(4px)}
[dir="rtl"] .ways a:hover{transform:translateX(-4px)}
.ways small{color:var(--muted)}
footer{padding:0 0 40px;color:var(--muted);font-size:.92rem}
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.js .rv.in{opacity:1;transform:none}
@media (max-width:860px){
.hero .grid,.about,.contact{grid-template-columns:1fr}
.cards,.svc{grid-template-columns:1fr}
nav ul{display:none}section{padding:60px 0}.contact{padding:28px 20px}.stats{padding:22px 12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>
</head>
